name: Unpack project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Unpack and commit
        shell: bash
        run: |
          if [ ! -f XisoExtractor.zip ]; then echo "::error::XisoExtractor.zip is not in the repository root"; exit 1; fi
          unzip -q -o XisoExtractor.zip -x '.github/*'
          git rm -q --cached XisoExtractor.zip
          rm XisoExtractor.zip
          git add -A
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -q -m "Unpack XisoExtractor sources"
          git push
