name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the APK to a release on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare signing key (only if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "No signing secrets: using the debug key"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # supports both a normal repo layout and a repo that only holds XisoExtractor.zip
          if [ -f XisoExtractor.zip ] && [ ! -f gradlew ]; then
            unzip -q XisoExtractor.zip
            cd XisoExtractor
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp "$(find . -name 'app-release.apk' | head -n 1)" "$GITHUB_WORKSPACE/XisoExtractor.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: XisoExtractor-apk
          path: XisoExtractor.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: XisoExtractor.apk
